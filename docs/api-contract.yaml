openapi: 3.1.0
info:
  title: ERP Core API
  version: 1.0.0
  description: Catálogo de categorias e produtos e identidade da sessão autenticada.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      summary: Estado básico da API
      security: []
      responses:
        '200':
          description: Processo disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
  /actuator/info:
    get:
      summary: Informações do Actuator não disponíveis a clientes
      description: O Actuator expõe esta rota, mas a política deny-by-default rejeita acesso anônimo e autenticado.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/platform/me:
    get:
      summary: Identidade do principal autenticado
      description: Retorna somente o subject OIDC (claim sub) e authorities reconhecidas pelo servidor.
      responses:
        '200':
          description: Identidade autenticada
          content:
            application/json:
              schema:
                type: object
                required: [userId, authorities]
                additionalProperties: false
                properties:
                  userId:
                    type: string
                  authorities:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/categories:
    get:
      summary: Lista categorias paginadas
      description: Leitura permitida a ADMIN, MANAGER, SALES e STOCK_OPERATOR. Inclui ativas e inativas.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Página de categorias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria categoria
      description: ADMIN e MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoria criada
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Consulta categoria
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza categoria
      description: ADMIN e MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Desativa categoria sem apagar histórico
      description: ADMIN e MANAGER. Produtos existentes permanecem associados; novos vínculos com a categoria inativa são bloqueados.
      responses:
        '204':
          description: Categoria desativada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/products:
    get:
      summary: Lista produtos paginados
      description: Leitura permitida a ADMIN, MANAGER, SALES e STOCK_OPERATOR. Sem filtro de estado, inclui produtos ativos e inativos.
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: sku
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Página de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria produto
      description: ADMIN e MANAGER. Somente categorias ativas podem ser associadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Consulta produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza produto
      description: ADMIN e MANAGER. A categoria indicada deve estar ativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Desativa produto sem apagar histórico
      description: ADMIN e MANAGER.
      responses:
        '204':
          description: Produto desativado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      description: Máximo 100 itens.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    sort:
      name: sort
      in: query
      description: Propriedade e direção, por exemplo name,asc.
      schema:
        type: array
        items:
          type: string
        default: [name,asc]
      style: form
      explode: true
  schemas:
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 2000
    Category:
      type: object
      additionalProperties: false
      required: [id, name, description, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductRequest:
      type: object
      required: [sku, name, categoryId, price]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
          description: Normalizado como trim e maiúsculas.
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, description, categoryId, price, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        description:
          type: [string, 'null']
        categoryId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryPage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    ProductPage:
      type: object
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Error:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Bearer token ausente ou inválido
      headers:
        WWW-Authenticate:
          schema:
            type: string
    Forbidden:
      description: Principal autenticado sem permissão para a operação
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de unicidade ou regra relacional
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
