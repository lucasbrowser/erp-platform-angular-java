openapi: 3.1.0
info:
  title: ERP Core API
  version: 1.0.0
  description: Contrato técnico inicial; não há recursos de negócio nesta fase.
servers:
  - url: http://localhost:8080
paths:
  /actuator/health:
    get:
      summary: Estado de saúde básico da API
      security: []
      responses:
        '200':
          description: Processo disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
  /api/v1/platform/me:
    get:
      summary: Identidade do principal autenticado
      description: Retorna somente o subject OIDC (claim sub) e authorities reconhecidas pelo servidor. Não aceita identidade fornecida pelo cliente e nunca retorna tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Principal autenticado
          content:
            application/json:
              schema:
                type: object
                required: [userId, authorities]
                additionalProperties: false
                properties:
                  userId:
                    type: string
                    description: Subject OIDC (claim sub)
                  authorities:
                    type: array
                    items:
                      type: string
                    example: [ROLE_SALES]
        '401':
          description: Access token ausente ou inválido
  /api/v1:
    get:
      summary: Reservado para recursos versionados futuros
      description: Nenhum recurso é publicado nesta rota até existir contrato de negócio aprovado. Recursos futuros aceitam access tokens OIDC do issuer Keycloak configurado com audience erp-core-api; ID tokens não são aceitos.
      security:
        - bearerAuth: []
      responses:
        '401':
          description: Access token bearer ausente, inválido, expirado, com issuer não confiável ou sem a audiência da API
        '403':
          description: Access token válido, mas sem a permissão exigida pela operação
        '404':
          description: Recurso ainda não implementado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
